[tool.poetry]
name = "lacuna"
version = "0.1.0"
description = "Replication package for Java dependence closure measurements"
authors = ["Anonymous"]
readme = "README.md"
packages = [{include = "lacuna", from = "src"}]
include = [{path = "src/lacuna/resources/tokenizer.json", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pydantic = "2.13.0"
typer = "0.17.4"
rich = "14.2.0"
pyyaml = "6.0.3"
numpy = "2.3.4"
pyarrow = "21.0.0"
matplotlib = "3.10.7"
tokenizers = "0.22.1"
requests = "2.32.5"
tree-sitter = "0.25.2"
tree-sitter-java = "0.23.5"

[tool.poetry.scripts]
lacuna = "lacuna.cli:app"

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"
